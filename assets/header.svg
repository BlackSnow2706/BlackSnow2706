<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Piyush Anand, Co-Founder and CTO">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".12"/>
    </pattern>
    <style>
      .name{font:900 118px Impact,'Arial Black',sans-serif;letter-spacing:4px;font-style:italic}
      .tag{font:700 30px 'Comic Sans MS','Trebuchet MS',sans-serif;fill:#c8f000;letter-spacing:3px}
      .pill{font:800 22px 'Trebuchet MS',Arial,sans-serif}
      .bob{animation:bob 3s ease-in-out infinite}
      .bob2{animation:bob 3s ease-in-out -1.5s infinite}
      .spin{transform-origin:center;transform-box:fill-box;animation:spin 14s linear infinite}
      .l1,.l2,.l3{opacity:0;animation-fill-mode:both}
      .l1{animation:cycle 9s infinite}
      .l2{animation:cycle 9s 3s infinite}
      .l3{animation:cycle 9s 6s infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes cycle{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="380" fill="#7b2cff"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect x="0" y="372" width="1200" height="8" fill="#c8f000"/>

  <g class="spin" opacity=".9"><path d="M1090 70l14 30 32 4-24 22 7 32-29-16-29 16 7-32-24-22 32-4z" fill="#c8f000" stroke="#0b0d12" stroke-width="4" stroke-linejoin="round"/></g>
  <circle cx="90" cy="300" r="26" fill="none" stroke="#fff" stroke-width="6" opacity=".35"/>
  <rect x="1040" y="290" width="60" height="60" rx="12" fill="none" stroke="#0b0d12" stroke-width="6" opacity=".35" transform="rotate(14 1070 320)"/>

  <g transform="rotate(-2 600 150)">
    <text class="name" x="600" y="162" text-anchor="middle" fill="#0b0d12" stroke="#0b0d12" stroke-width="14" stroke-linejoin="round" transform="translate(6 7)">PIYUSH ANAND</text>
    <text class="name" x="600" y="162" text-anchor="middle" fill="#fff" stroke="#0b0d12" stroke-width="10" stroke-linejoin="round" paint-order="stroke">PIYUSH ANAND</text>
  </g>

  <g>
    <text class="tag l1" x="600" y="228" text-anchor="middle">CO-FOUNDER &amp; CTO @ SAFESPHERE</text>
    <text class="tag l2" x="600" y="228" text-anchor="middle">FULL STACK · IOT · APPLIED AI</text>
    <text class="tag l3" x="600" y="228" text-anchor="middle">ALWAYS LEARNING. ALWAYS BUILDING.</text>
  </g>

  <g class="bob">
    <rect x="380" y="270" width="210" height="56" rx="28" fill="#0b0d12" stroke="#c8f000" stroke-width="3"/>
    <text class="pill" x="485" y="306" text-anchor="middle" fill="#fff">Black Snow</text>
  </g>
  <g class="bob2">
    <rect x="615" y="270" width="230" height="56" rx="28" fill="#0b0d12" opacity=".95" transform="translate(4 5)"/>
    <rect x="615" y="270" width="230" height="56" rx="28" fill="#c8f000" stroke="#0b0d12" stroke-width="3"/>
    <text class="pill" x="730" y="306" text-anchor="middle" fill="#0b0d12">piyushanand.me</text>
  </g>
</svg>
